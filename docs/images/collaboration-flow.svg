<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">NeoOrg collaboration flow</title>
  <desc id="desc">A shared goal has one accountable owner. Optional specialist contributions feed the owner's delivery, which receives independent review and becomes a reviewed result.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 6 4 1 7" fill="none" stroke="#71888c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="400" rx="24" fill="#f8fafb"/>
  <g fill="none" stroke="#71888c" stroke-width="2" marker-end="url(#arrow)">
    <path d="M364 92H419"/><path d="M770 92H825"/><path d="M1006 160V230"/>
    <path d="M836 302H781"/><path d="M430 302H375"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(24 24)">
      <rect width="340" height="136" rx="16" fill="#fff" stroke="#dce5e8"/>
      <text x="24" y="32" font-size="12" font-weight="700" letter-spacing="1.4" fill="#788b91">01 / DIRECTION</text>
      <text x="24" y="67" font-size="22" font-weight="700" fill="#243a42">A shared goal</text>
      <text x="24" y="97" font-size="16" fill="#60757c">Human context and clear criteria</text>
    </g>
    <g transform="translate(430 24)">
      <rect width="340" height="136" rx="16" fill="#e9f6f1" stroke="#b8d9cd"/>
      <text x="24" y="32" font-size="12" font-weight="700" letter-spacing="1.4" fill="#367a67">02 / RESPONSIBILITY</text>
      <text x="24" y="67" font-size="22" font-weight="700" fill="#185744">One accountable owner</text>
      <text x="24" y="97" font-size="16" fill="#477267">Stays with the outcome</text>
    </g>
    <g transform="translate(836 24)">
      <rect width="340" height="136" rx="16" fill="#fff" stroke="#dce5e8"/>
      <text x="24" y="32" font-size="12" font-weight="700" letter-spacing="1.4" fill="#788b91">03 / WHEN USEFUL</text>
      <text x="24" y="67" font-size="22" font-weight="700" fill="#243a42">Specialist contributions</text>
      <text x="24" y="97" font-size="16" fill="#60757c">Bounded work from teammates</text>
    </g>
    <g transform="translate(836 234)">
      <rect width="340" height="136" rx="16" fill="#fff" stroke="#dce5e8"/>
      <text x="24" y="32" font-size="12" font-weight="700" letter-spacing="1.4" fill="#788b91">04 / INTEGRATION</text>
      <text x="24" y="67" font-size="22" font-weight="700" fill="#243a42">A frozen delivery</text>
      <text x="24" y="97" font-size="16" fill="#60757c">The owner brings the work together</text>
    </g>
    <g transform="translate(430 234)">
      <rect width="340" height="136" rx="16" fill="#fff5e6" stroke="#edd8b5"/>
      <text x="24" y="32" font-size="12" font-weight="700" letter-spacing="1.4" fill="#956b31">05 / QUALITY</text>
      <text x="24" y="67" font-size="22" font-weight="700" fill="#6f522b">Independent review</text>
      <text x="24" y="97" font-size="16" fill="#8a7555">Checked against acceptance criteria</text>
    </g>
    <g transform="translate(24 234)">
      <rect width="340" height="136" rx="16" fill="#e9f6f1" stroke="#b8d9cd"/>
      <text x="24" y="32" font-size="12" font-weight="700" letter-spacing="1.4" fill="#367a67">06 / RESULT</text>
      <text x="24" y="67" font-size="22" font-weight="700" fill="#185744">A reviewed result</text>
      <text x="24" y="97" font-size="16" fill="#477267">Ready for human judgment</text>
    </g>
  </g>
</svg>
