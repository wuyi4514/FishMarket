<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">NeoOrg 协作流程</title>
  <desc id="desc">人提出共享目标，一位负责人持续跟进，按需引入专业贡献，整合冻结交付，再由独立成员依据标准评审，形成供人判断的结果。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 6 4 1 7" fill="none" stroke="#71888c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="400" rx="24" fill="#f8fafb"/>
  <g fill="none" stroke="#71888c" stroke-width="2" marker-end="url(#arrow)">
    <path d="M364 92H419"/><path d="M770 92H825"/><path d="M1006 160V230"/>
    <path d="M836 302H781"/><path d="M430 302H375"/>
  </g>
  <g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <g transform="translate(24 24)">
      <rect width="340" height="136" rx="16" fill="#fff" stroke="#dce5e8"/>
      <text x="24" y="32" font-size="12" font-weight="700" letter-spacing="1.4" fill="#788b91">01 / 方向</text>
      <text x="24" y="67" font-size="22" font-weight="700" fill="#243a42">人提出共享目标</text>
      <text x="24" y="97" font-size="16" fill="#60757c">补充背景，明确验收标准</text>
    </g>
    <g transform="translate(430 24)">
      <rect width="340" height="136" rx="16" fill="#e9f6f1" stroke="#b8d9cd"/>
      <text x="24" y="32" font-size="12" font-weight="700" letter-spacing="1.4" fill="#367a67">02 / 责任</text>
      <text x="24" y="67" font-size="22" font-weight="700" fill="#185744">一位结果负责人</text>
      <text x="24" y="97" font-size="16" fill="#477267">围绕同一个目标持续跟进</text>
    </g>
    <g transform="translate(836 24)">
      <rect width="340" height="136" rx="16" fill="#fff" stroke="#dce5e8"/>
      <text x="24" y="32" font-size="12" font-weight="700" letter-spacing="1.4" fill="#788b91">03 / 按需协作</text>
      <text x="24" y="67" font-size="22" font-weight="700" fill="#243a42">专业同事贡献</text>
      <text x="24" y="97" font-size="16" fill="#60757c">分工有边界，贡献可追踪</text>
    </g>
    <g transform="translate(836 234)">
      <rect width="340" height="136" rx="16" fill="#fff" stroke="#dce5e8"/>
      <text x="24" y="32" font-size="12" font-weight="700" letter-spacing="1.4" fill="#788b91">04 / 整合</text>
      <text x="24" y="67" font-size="22" font-weight="700" fill="#243a42">冻结交付版本</text>
      <text x="24" y="97" font-size="16" fill="#60757c">由负责人整合完整成果</text>
    </g>
    <g transform="translate(430 234)">
      <rect width="340" height="136" rx="16" fill="#fff5e6" stroke="#edd8b5"/>
      <text x="24" y="32" font-size="12" font-weight="700" letter-spacing="1.4" fill="#956b31">05 / 质量</text>
      <text x="24" y="67" font-size="22" font-weight="700" fill="#6f522b">独立评审</text>
      <text x="24" y="97" font-size="16" fill="#8a7555">依据约定的验收标准检查</text>
    </g>
    <g transform="translate(24 234)">
      <rect width="340" height="136" rx="16" fill="#e9f6f1" stroke="#b8d9cd"/>
      <text x="24" y="32" font-size="12" font-weight="700" letter-spacing="1.4" fill="#367a67">06 / 结果</text>
      <text x="24" y="67" font-size="22" font-weight="700" fill="#185744">已评审的交付结果</text>
      <text x="24" y="97" font-size="16" fill="#477267">保留人的最终业务判断</text>
    </g>
  </g>
</svg>
